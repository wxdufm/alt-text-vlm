<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Album Cover Review</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">VLM Training Review</p>
      <h1>Album Cover Description Review</h1>
    </header>

    <section class="review-layout">

      <div class="cover-frame">
        <img id="cover" alt="">
      </div>

      <div class="panel">

        <div class="release-meta">
          <h2 id="albumTitle">Album: Loading...</h2>
          <p id="artistName">By: Loading...</p>
        </div>

        <div class="description-block">
          <span class="section-label">Generated description</span>
          <p id="description">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit.
          </p>
        </div>

        <div class="buttons">
          <button id="approveBtn" class="button button-approve">
            Approve
          </button>

          <button id="denyBtn" class="button button-deny">
            Deny
          </button>

          <button id="skipBtn" class="button button-next">
            Skip
          </button>
        </div>

        <div id="denyPanel" class="deny-panel" hidden>
          <label for="denyReason">Denial notes</label>
          <textarea
            id="denyReason"
            placeholder="Optional: Explain why you rejected this description, Or give your ideal description for the album cover"
          ></textarea>

          <div class="deny-actions">
            <button id="confirmDenyBtn" class="button button-deny">
              Confirm
            </button>

            <button id="cancelDenyBtn" class="button button-cancel">
              Cancel
            </button>
          </div>
        </div>

        <p id="status" role="status"></p>

      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
